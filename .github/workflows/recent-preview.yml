name: Recent news preview

on:
  schedule:
    - cron: '17 0,4,10,14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Recheck eligible sources in this slot (still respects backoff and daily budget)
        type: boolean
        default: false
  push:
    branches: [codex/recent-aggregation-preview]
    paths:
      - 'src/recent/**'
      - 'src/workers/recentPreview.ts'
      - 'src/ingestion/**'
      - 'config/**'
      - 'scripts/*recent*'
      - 'scripts/preview-r2.ts'
      - 'wrangler.preview.toml'
      - '.github/workflows/recent-preview.yml'

permissions:
  contents: read

concurrency:
  group: space-intel-recent-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'Kindeed/space-intel'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recent-aggregation-preview
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify preview source and code
        run: |
          pnpm typecheck
          pnpm check:config
          pnpm test
          pnpm recent:collect --validate
      - name: Restore preview state and reserve shared daily request budget
        run: node scripts/run-recent.mjs --task=r2 prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Collect due preview sources
        env:
          FORCE_RECHECK: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_RECHECK" = "true" ]; then
            pnpm recent:collect --force
          else
            pnpm recent:collect
          fi
      - name: Publish only the isolated preview snapshot
        run: node scripts/run-recent.mjs --task=r2 publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Account for requests even when collection fails
        if: always()
        run: node scripts/run-recent.mjs --task=r2 finalize
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build isolated preview app
        run: |
          pnpm build
          node scripts/build-recent-preview.mjs
      - name: Deploy preview branch only
        run: pnpm exec wrangler pages deploy site --cwd .recent/deploy --project-name space-intel --branch recent-aggregation-preview --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
